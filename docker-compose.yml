version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: halaqy-db
    environment:
      POSTGRES_USER: ${DB_USER:-halaqy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-halaqy123}
      POSTGRES_DB: ${DB_NAME:-halaqy}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halaqy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: halaqy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
